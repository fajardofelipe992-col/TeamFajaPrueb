<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>TeamFaja</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@200;900&display=swap">
<style>
:root{--tx:#fff;--mu:#b3b3b3;--bd:rgba(255,255,255,.12);--card:rgba(16,16,16,.72);--ok:#2ecc71;--wa:#f1c40f;--er:#ef4444}
*{box-sizing:border-box}html{background:#000}
body{margin:0;color:var(--tx);font:16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.84)),url(fondo.jpg) center top/cover no-repeat}
body.lg::before{background:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.68)),url(fondo.jpg) center top/cover no-repeat}
.logo{font-family:Montserrat,sans-serif;letter-spacing:-.02em;line-height:1;white-space:nowrap;display:inline-block}.logo span{font-weight:200}.logo b{font-weight:900}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
main{max-width:760px;margin:auto;padding:16px}
h2{font-size:22px;font-weight:600;margin:6px 0 14px}h3{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#d8d8d8;margin:0 0 8px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu);font-size:14px}b{font-weight:600}
input,select,button,.btn{font:inherit;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;max-width:100%}
input,select{width:100%}select option{background:#111}
button,.btn{cursor:pointer;font-weight:500;text-decoration:none;display:inline-block;text-align:center}
.p{background:#fff;color:#000;border-color:#fff;font-weight:600}.wide{width:100%;margin-bottom:12px}.s{padding:6px 10px;font-size:13px;margin-top:8px}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.fl>*{flex:1;min-width:130px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;color:#000}.tag.ok{background:var(--ok)}.tag.wa{background:var(--wa)}.tag.er{background:var(--er);color:#fff}
.err{color:var(--er);min-height:22px;font-size:14px;margin:6px 0}
.login{min-height:78vh;display:flex;flex-direction:column;justify-content:center;gap:14px;color:#fff}
.sub{letter-spacing:.42em;font-weight:600;text-align:center;margin-top:14px;font-size:clamp(11px,3.2vw,16px)}
</style></head><body>
<header id="out" style="display:none"><span class="logo" style="font-size:22px"><span>TEAM</span><b>FAJA</b></span><button class="s" data-act="logout" style="margin:0">Salir</button></header>
<main id="app"></main>
<script type="module" src="app.js"></script>
</body></html>
